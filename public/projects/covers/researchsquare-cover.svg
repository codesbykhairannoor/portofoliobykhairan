<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 660" width="1024" height="660">
  <defs>
    <radialGradient id="rs-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3aae74" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#15324e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#070a12" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(58,174,116,0.7)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(58,174,116,0.35)"/>
    </linearGradient>
    <filter id="rs-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3aae74" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="660" fill="#060911"/>
  <rect width="1024" height="660" fill="url(#grid)"/>

  <!-- Ambient Radiant Glow -->
  <circle cx="512" cy="300" r="420" fill="url(#rs-glow)"/>

  <!-- Sleek High-Tech Card Container -->
  <rect x="112" y="80" width="800" height="500" rx="28" fill="#0b101d" fill-opacity="0.82" stroke="url(#card-border)" stroke-width="1.75"/>

  <!-- Subtly styled inner backdrop glow for logo -->
  <rect x="140" y="108" width="744" height="444" rx="20" fill="#080c16" fill-opacity="0.45" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Big & Bold Research Square Hero Logo -->
  <g transform="translate(230, 190)" filter="url(#rs-drop)">
    <!-- Research Square Isometric Cube Mark -->
    <g transform="scale(1.25)">
      <path d="M108,46.063L216,0V36.81L108,82.873Z" fill="#1e415f"/>
      <path d="M108,46.063L0,0V36.81L108,82.873Z" fill="#ffd43b"/>
      <path d="M216,92.197L108,46.134v36.81l108,46.063Z" fill="#3aae74"/>
      <path d="M0,92.197L108,46.134v36.81L0,129.007Z" fill="#8bcb83"/>
      <path d="M108,138.331l108-46.063v36.81l-108,46.063Z" fill="#1e415f"/>
      <path d="M108,138.331L0,92.268v36.81l108,46.063Z" fill="#3aae74"/>
    </g>

    <!-- Typography -->
    <g transform="translate(290, 72)">
      <text x="0" y="0" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">Research Square</text>
      <text x="2" y="34" fill="#86efac" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="17" font-weight="700" letter-spacing="2">PART OF SPRINGER NATURE</text>
    </g>
  </g>

  <!-- High-Contrast Subtitle Badge -->
  <g transform="translate(512, 452)" text-anchor="middle">
    <rect x="-185" y="-21" width="370" height="42" rx="21" fill="rgba(58,174,116,0.15)" stroke="rgba(58,174,116,0.55)" stroke-width="1.25"/>
    <circle cx="-150" cy="0" r="5" fill="#34d399"/>
    <text x="8" y="6" fill="#a7f3d0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="2.5">DOI-INDEXED RESEARCH PREPRINT</text>
  </g>
</svg>
