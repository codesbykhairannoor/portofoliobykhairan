<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 660" width="1024" height="660">
  <defs>
    <radialGradient id="pypi-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3775a9" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#ffd43b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(0,0,0,0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="py-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3775a9"/>
      <stop offset="100%" stop-color="#1e415f"/>
    </linearGradient>
    <linearGradient id="py-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="660" fill="#ffffff"/>
  <rect width="1024" height="660" fill="url(#grid)"/>
  <circle cx="512" cy="330" r="400" fill="url(#pypi-glow)"/>

  <!-- Card container outline -->
  <rect x="232" y="160" width="560" height="340" rx="24" fill="#fafbfc" stroke="rgba(55,117,169,0.22)" stroke-width="1.5"/>

