<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 660" width="1024" height="660">
  <defs>
    <radialGradient id="pypi-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3775a9" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#ffd43b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pypi-spot" cx="45%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070a12" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(55,117,169,0.7)"/>
      <stop offset="50%" stop-color="rgba(255,212,59,0.3)"/>
      <stop offset="100%" stop-color="rgba(55,117,169,0.4)"/>
    </linearGradient>
    <linearGradient id="py-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b8bbe"/>
      <stop offset="100%" stop-color="#1e415f"/>
    </linearGradient>
    <linearGradient id="py-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd43b"/>
      <stop offset="100%" stop-color="#ffe873"/>
    </linearGradient>
    <filter id="pypi-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3775a9" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="660" fill="#060911"/>
  <rect width="1024" height="660" fill="url(#grid)"/>

  <!-- Ambient Radiant Glow -->
  <circle cx="512" cy="300" r="420" fill="url(#pypi-glow)"/>
  <circle cx="480" cy="270" r="260" fill="url(#pypi-spot)"/>

  <!-- Sleek High-Tech Card Container -->
  <rect x="112" y="80" width="800" height="500" rx="28" fill="#0b101d" fill-opacity="0.82" stroke="url(#card-border)" stroke-width="1.75"/>

  <!-- Subtly styled inner backdrop glow for logo -->
  <rect x="140" y="108" width="744" height="444" rx="20" fill="#080c16" fill-opacity="0.45" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Big & Bold PyPI Hero Logo (Icon + Wordmark) -->
  <g transform="translate(305, 185)" filter="url(#pypi-drop)">
    <!-- Large Python Dual Snake Mark (160px x 160px) -->
    <svg viewBox="0 0 110 110" width="160" height="160">
      <path fill="url(#py-blue)" d="M54.5,2 C30.6,2 32.1,12.3 32.1,12.3 L32.1,23 L55,23 L55,26.3 L23.5,26.3 C14.3,26.3 6.1,31.7 6.1,44.7 C6.1,57.7 13.3,58.8 13.3,58.8 L21,58.8 L21,50.7 C21,41.4 28.9,41.4 28.9,41.4 L51.9,41.4 C58.9,41.4 64.6,35.6 64.6,28.7 L64.6,15.3 C64.6,8.4 58.7,2 54.5,2 Z M43.2,8.8 C45.8,8.8 47.9,10.9 47.9,13.5 C47.9,16.1 45.8,18.2 43.2,18.2 C40.6,18.2 38.5,16.1 38.5,13.5 C38.5,10.9 40.6,8.8 43.2,8.8 Z"/>
      <path fill="url(#py-yellow)" d="M55.5,108 C79.4,108 77.9,97.7 77.9,97.7 L77.9,87 L55,87 L55,83.7 L86.5,83.7 C95.7,83.7 103.9,78.3 103.9,65.3 C103.9,52.3 96.7,51.2 96.7,51.2 L89,51.2 L89,59.3 C89,68.6 81.1,68.6 81.1,68.6 L58.1,68.6 C51.1,68.6 45.4,74.4 45.4,81.3 L45.4,94.7 C45.4,101.6 51.3,108 55.5,108 Z M66.8,101.2 C64.2,101.2 62.1,99.1 62.1,96.5 C62.1,93.9 64.2,91.8 66.8,91.8 C69.4,91.8 71.5,93.9 71.5,96.5 C71.5,99.1 69.4,101.2 66.8,101.2 Z"/>
    </svg>

    <!-- Bold PyPI Wordmark -->
    <text x="190" y="118" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="96" font-weight="900" letter-spacing="-2">PyPI</text>
  </g>

  <!-- High-Contrast Subtitle Badge -->
  <g transform="translate(512, 452)" text-anchor="middle">
    <rect x="-165" y="-21" width="330" height="42" rx="21" fill="rgba(55,117,169,0.15)" stroke="rgba(55,117,169,0.55)" stroke-width="1.25"/>
    <circle cx="-132" cy="0" r="5" fill="#ffd43b"/>
    <text x="8" y="6" fill="#93c5fd" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14.5" font-weight="800" letter-spacing="2.5">PYTHON PACKAGE INDEX</text>
  </g>
</svg>
